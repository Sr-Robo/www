name: Deploy to OCI

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '22'

    - name: Install dependencies
      run: npm install

    - name: Build the site
      run: npm run build

    - name: Deploy to OCI via SSH
      uses: appleboy/ssh-action@v0.1.4
      with:
        host: ${{ secrets.OCI_HOST }}
        username: ${{ secrets.OCI_USER }}
        key: ${{ secrets.OCI_SSH_KEY }}
        script: |
          cd /home/robo/www
          git pull origin main
          npm install
          npm run build
          sudo systemctl restart evershop.service
