name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Adicionar remote upstream
        run: git remote add upstream https://github.com/evershopcommerce/evershop.git

      - name: Buscar upstream
        run: git fetch upstream

      - name: Tentar merge numa branch de sync
        id: sync
        run: |
          BRANCH="upstream-sync-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          SYNC_BASE=$(git rev-parse HEAD)
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if git merge upstream/main --no-edit; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            # Comita o estado com marcadores de conflito para revisão manual no PR.
            git add -A
            git commit -m "sync upstream/main (conflitos pendentes de resolução manual)" --no-verify
          fi

          # GitHub blocks GITHUB_TOKEN from updating workflow files. These
          # Actions workflows belong to this fork (release.yml targets our
          # release process), so keep the versions from dev in the sync PR.
          git restore --source="$SYNC_BASE" --staged --worktree -- .github/workflows/
          git clean -fd -- .github/workflows/
          git add -A -- .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m "ci: preserve fork-owned GitHub Actions workflows"
          fi

      - name: Push da branch de sync
        run: git push origin "${{ steps.sync.outputs.branch }}" --force

      - name: Abrir ou atualizar PR
        uses: actions/github-script@v7
        env:
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          SYNC_CONFLICT: ${{ steps.sync.outputs.conflict }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const head = `${owner}:${process.env.SYNC_BRANCH}`;
            const title = 'Sync com upstream evershopcommerce/evershop';
            const body = `PR automático de sincronização diária com o repositório oficial
            (\`evershopcommerce/evershop\`, branch \`main\`).

            Conflitos detectados: **${process.env.SYNC_CONFLICT}**

            Se houver conflitos, os marcadores (\`<<<<<<<\`) estão commitados nesta
            branch — resolva localmente antes de aprovar o merge. Nunca é feito
            merge automático direto em \`dev\`.`;

            const { data: openPullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'dev',
              head
            });

            let pullRequest;
            if (openPullRequests.length > 0) {
              const { data } = await github.rest.pulls.update({
                owner,
                repo,
                pull_number: openPullRequests[0].number,
                title,
                body
              });
              pullRequest = data;
            } else {
              const { data } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: process.env.SYNC_BRANCH,
                base: 'dev',
                body
              });
              pullRequest = data;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullRequest.number,
              labels: ['upstream-sync']
            });
            core.info(`PR #${pullRequest.number}: ${pullRequest.html_url}`);
